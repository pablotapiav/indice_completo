name: Actualizar Índice del Completo

on:
  schedule:
    # Todos los lunes 09:00 UTC (~06:00 Chile continental, hora aprox. según horario de verano)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

# Permisos mínimos: solo lo necesario para que el job pueda escribir el
# commit con los datos nuevos. No se usan secrets ni tokens externos.
permissions:
  contents: write

concurrency:
  group: actualizar-indice
  cancel-in-progress: false

jobs:
  scrape-y-calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr scraper (Jumbo, Santa Isabel)
        run: python -m scraper.run_scraper

      - name: Calcular Índice del Completo (base 100)
        run: python -m index.compute_index

      - name: Traer IPC oficial (mindicador.cl)
        run: python -m index.fetch_ipc_oficial

      - name: Commit de los datos actualizados
        run: |
          git config user.name "idc-bot"
          git config user.email "idc-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "data: actualización semanal del Índice del Completo"
            git push
          fi
